<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CasePulse — Pointed Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<style>
:root{
  --rail:#17204b; --rail2:#1f2a5e; --navy:#2d3d8a; --navy-soft:#e6eaf6;
  --signal:#f79420; --signal-soft:#fff1e1;
  --canvas:#edf0f6; --sheet:#ffffff; --ink:#121a3a; --ink2:#323b5e; --muted:#5b6482; --rule:#d7dce8; --rule2:#e8ebf2;
  --low:#2e7d5b; --low-soft:#e3f2ea; --mid:#a86a12; --mid-soft:#fbf0dc; --high:#b3362b; --high-soft:#f8e4e1;
  --fig:'Barlow Semi Condensed','Public Sans',sans-serif;
  --ui:'Public Sans',system-ui,sans-serif;
  --doc:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--ui);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px;line-height:1.15}h2{font-size:21px;line-height:1.2}h3{font-size:16px;line-height:1.3}h4{font-size:14px}
p{margin:.4em 0}
a{color:var(--navy)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.fig{font-family:var(--fig);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.005em}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#c9d0ea;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px}
.rail .brand{cursor:pointer;padding:0 6px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.rail .brand img{height:26px;display:block}
.rail .product{margin-top:12px;color:#fff;font-weight:700;font-size:19px;letter-spacing:-.01em}
.rail .product small{display:block;color:#8f99c2;font-weight:500;font-size:12.5px;letter-spacing:0;margin-top:2px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#c9d0ea;font:500 14.5px var(--ui);padding:10px 12px;border-radius:8px;cursor:pointer;position:relative}
.navlist button svg{width:18px;height:18px;flex:none;opacity:.85}
.navlist button:hover{background:var(--rail2);color:#fff}
.navlist button.on{background:var(--rail2);color:#fff;font-weight:600}
.navlist button.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.rail .railfoot{margin-top:auto;font-size:12px;line-height:1.5;color:#7f89b3;padding:0 6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 32px 0}
.topbar h1{font-size:24px}
.topbar .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.content{padding:18px 32px 60px;max-width:1240px;width:100%}
.mobilebar,.tabbar{display:none}

@media (max-width:900px){
  .shell{display:block}
  .rail{display:none}
  .mobilebar{display:flex;align-items:center;gap:10px;background:var(--rail);padding:12px 16px;position:sticky;top:0;z-index:10}
  .mobilebar img{height:20px}
  .mobilebar b{color:#fff;font-size:15px;margin-left:auto;font-weight:700}
  .topbar{padding:16px 16px 0}
  .topbar h1{font-size:21px}
  .topbar .tools{margin-left:0;width:100%}
  .content{padding:14px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px var(--ui);color:var(--muted);padding:6px 0;cursor:pointer;border-radius:8px}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--navy)}
  .tabbar button.on svg{color:var(--signal)}
}

/* ---------- surfaces ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;margin:0 0 16px}
.sheet.flush{padding:0}
.sheet-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheet-h .sub{color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split>.sheet{margin:0}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.stack>*+*{margin-top:16px}
.mut{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12.5px}
.hr{height:1px;background:var(--rule2);margin:16px 0}
.list{margin:6px 0;padding-left:18px}.list li{margin:5px 0}
.list.plain{list-style:none;padding:0}.list.plain li{padding:8px 0;border-bottom:1px solid var(--rule2);margin:0}.list.plain li:last-child{border:0}

/* ---------- forms ---------- */
fieldset{border:0;margin:0 0 6px;padding:0}
legend{font-weight:700;font-size:14px;color:var(--navy);padding:0;margin:4px 0 2px}
.fs{border-top:1px solid var(--rule2);padding-top:14px;margin-top:16px}
.fs:first-child{border:0;padding-top:0;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px;color:var(--ink2)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 11px;font:15px var(--ui);background:#fbfcfe;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#9aa1b8}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft);background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14px;margin:12px 0;color:var(--ink)}
.chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--navy)}
.radio{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;padding:13px 14px;margin:8px 0;cursor:pointer;color:var(--ink);background:#fbfcfe}
.radio.on{border-color:var(--navy);background:var(--navy-soft)}
.radio input{margin-top:4px;accent-color:var(--navy)}
.fileup{border:1px dashed #b9c1d6;border-radius:6px;padding:16px;font-size:14px;color:var(--ink2);position:relative;display:flex;gap:12px;align-items:center;background:#fbfcfe}
.fileup svg{width:22px;height:22px;color:var(--navy);flex:none}
.fileup input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fileup:hover{border-color:var(--navy)}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rule2);border-radius:5px;margin:6px 0;font-size:13.5px;background:#fff}
.file svg{width:15px;height:15px;color:var(--muted);vertical-align:-2px;margin-right:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--navy);border-radius:5px;padding:10px 16px;font:600 14.5px var(--ui);cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
.btn:hover{background:#24327a}
.btn.primary{padding:13px 20px;font-size:15.5px}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.red{background:var(--high);border-color:var(--high)}
.btn.green{background:var(--low);border-color:var(--low)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn svg{width:17px;height:17px}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);font:600 13.5px var(--ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;padding:3px;gap:2px;background:#fff}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:4px;font:600 13.5px var(--ui);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
.btn.ghost .spin{border-color:var(--rule);border-top-color:var(--navy)}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- status ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:4px;font-size:12.5px;font-weight:600;background:var(--rule2);color:var(--ink2);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.tag.low{background:var(--low-soft);color:var(--low)}.tag.mid{background:var(--mid-soft);color:var(--mid)}.tag.high{background:var(--high-soft);color:var(--high)}.tag.navy{background:var(--navy-soft);color:var(--navy)}
.note{padding:11px 13px;border-left:3px solid var(--mid);background:var(--mid-soft);color:#6e4609;font-size:13.5px;margin:12px 0;border-radius:0 5px 5px 0}
.note.err{border-color:var(--high);background:var(--high-soft);color:#7d2219}
.note.ok{border-color:var(--low);background:var(--low-soft);color:#1d5a40}
.note.info{border-color:var(--navy);background:var(--navy-soft);color:var(--ink2)}

/* ---------- overview ---------- */
.lead{max-width:62ch;font-size:16.5px;color:var(--ink2);margin:0 0 20px}
.entry{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;background:#fff;border:1px solid var(--rule);border-radius:6px;margin-bottom:16px;overflow:hidden}
.entry .about{padding:24px}
.entry .about h2{margin-bottom:6px}
.entry .quick{padding:24px;background:#f6f8fc;border-left:1px solid var(--rule)}
.entry .quick h4{margin-bottom:4px}
@media (max-width:760px){.entry{grid-template-columns:1fr}.entry .quick{border-left:0;border-top:1px solid var(--rule)}}
.steps-ol{counter-reset:st;list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.steps-ol li{counter-increment:st;font-size:13.5px;color:var(--ink2);border-top:2px solid var(--rule);padding-top:10px}
.steps-ol li::before{content:counter(st);font:600 22px var(--fig);color:var(--navy);display:block;margin-bottom:2px}
.steps-ol li b{display:block;color:var(--ink);margin-bottom:2px}
@media (max-width:900px){.steps-ol{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps-ol{grid-template-columns:1fr}}

/* ---------- advisor ---------- */
.subnav{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin:0 0 18px}
.subnav button{background:none;border:0;padding:10px 0;font:600 14.5px var(--ui);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--ink);border-color:var(--navy)}
.subnav button:disabled{opacity:.45;cursor:default}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo select{width:auto;min-width:240px;max-width:100%;padding:8px 10px;font-size:14px}
.demo span{font-weight:600;font-size:13.5px;color:var(--ink2)}
.runbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:6px}
.runbar .chk{margin:0;flex:1 1 280px;font-size:13.5px;color:var(--ink2)}

/* report: the desk */
.desk{display:grid;grid-template-columns:330px minmax(0,1fr);background:#fff;border:1px solid var(--rule);border-radius:6px;margin-bottom:16px;overflow:hidden}
@media (max-width:900px){.desk{grid-template-columns:1fr}}
.gaugebox{background:var(--rail);color:#fff;padding:22px 22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge{width:100%;max-width:270px;display:block}
.gauge .needle{transform-origin:150px 150px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.gauge .needle{transition:none}}
.gaugebox .fig.big{font-size:40px;line-height:1;margin-top:-6px}
.gaugebox .cap{color:#aab3d6;font-size:13px;margin-top:6px}
.gaugebox .nuke{margin-top:16px;width:100%;text-align:left;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;font-size:13px;color:#cfd5ee}
.gaugebox .nuke b{display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;margin-bottom:3px}
.lvl{width:10px;height:10px;border-radius:50%;display:inline-block}
.lvl.low{background:#5cc495}.lvl.elevated{background:var(--signal)}.lvl.high{background:#ff6b5c}
.deskmain{padding:22px 24px;min-width:0}
.headline{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 6px;max-width:60ch}
.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);margin:16px 0}
.readouts>div{padding:12px 14px 12px 0}
.readouts>div+div{padding-left:14px;border-left:1px solid var(--rule2)}
.readouts .fig{font-size:26px;display:block;line-height:1.1}
.readouts span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.readouts{grid-template-columns:1fr 1fr}.readouts>div:nth-child(3){border-left:0;padding-left:0}.readouts>div:nth-child(n+3){border-top:1px solid var(--rule2)}}

/* settlement strip */
.strip{position:relative;height:58px;margin:30px 4px 6px}
.strip .track{position:absolute;left:0;right:0;top:26px;height:6px;background:var(--rule2);border-radius:3px}
.strip .band{position:absolute;top:20px;height:18px;background:var(--navy);border-radius:3px}
.strip .mark{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11.5px;color:var(--muted);white-space:nowrap}
.strip .mark i{display:block;width:2px;height:14px;margin:3px auto 0;background:var(--ink2)}
.strip .mark.walk i{background:var(--high);height:34px}
.strip .mark.walk{color:var(--high);font-weight:600}
.strip .mark.open i{background:var(--signal);height:34px}
.strip .mark.open{color:#9a5a00;font-weight:600}
.strip .mark.low{top:auto;bottom:-22px}.strip .mark.low i{display:none}
.stripkey{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:26px}
.stripkey .fig{font-size:17px;color:var(--ink)}

.meter{margin:8px 0 14px}
.meter .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.meter .row .fig{font-size:17px}
.meter .bar{height:8px;background:var(--rule2);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter .bar i{display:block;height:100%;background:var(--navy)}
.scen{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13.5px;margin:7px 0}
.scen .bar{height:8px;background:var(--rule2);border-radius:4px;overflow:hidden}.scen .bar i{display:block;height:100%;background:var(--ink2)}
.scen .fig{text-align:right;font-size:15px}
.slider{margin:12px 0}
.slider .row{display:flex;justify-content:space-between;font-size:13.5px}
.slider .row b{font-family:var(--fig);font-size:16px;font-weight:600}
.slider input{width:100%;accent-color:var(--navy)}
.whatif-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--rule2)}
.whatif-out .fig{font-size:21px;display:block}
.whatif-out span{font-size:12px;color:var(--muted)}
.drv{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:14px}
.drv:last-child{border:0}
.drv .dir{font-weight:700;font-size:13px;line-height:1.6}
.drv .dir.up{color:var(--high)}.drv .dir.down{color:var(--low)}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.comp{padding:12px 0;border-bottom:1px solid var(--rule2)}
.comp:last-child{border:0}
.comp .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.comp a{color:var(--ink);font-weight:700;text-decoration:none;font-size:14.5px;line-height:1.35}
.comp a:hover{color:var(--navy);text-decoration:underline}
.comp .amt{font-family:var(--fig);font-weight:600;font-size:18px;color:var(--high)}
.comp .meta{font-size:12.5px;color:var(--muted);margin:2px 0}
.copybox{width:100%;min-height:160px;font:12.5px/1.45 ui-monospace,Menlo,monospace}

/* ---------- the bench ---------- */
.docket{width:100%;border-collapse:collapse;font-size:14px}
.docket th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--rule)}
.docket td{padding:13px 14px;border-bottom:1px solid var(--rule2);vertical-align:top}
.docket tr.row-link{cursor:pointer}
.docket tr.row-link:hover td{background:#f6f8fc}
.docket .title{font-weight:700;color:var(--ink)}
.docket .num{font-family:var(--fig);font-weight:600;font-size:16px;white-space:nowrap}
@media (max-width:700px){.docket thead{display:none}.docket tr{display:block;border-bottom:1px solid var(--rule2);padding:10px 14px}.docket td{display:block;border:0;padding:2px 0}}
.casehead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.casehead h2{flex:1 1 300px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 0;font-size:13.5px}
.facts div span{display:block;color:var(--muted);font-size:12.5px}
.facts div b{font-weight:600}
.stepper{display:flex;margin:18px 0 4px;counter-reset:sp}
.stepper span{flex:1;position:relative;font-size:12px;color:var(--muted);text-align:center;padding-top:20px}
.stepper span::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--rule)}
.stepper span::after{content:"";position:absolute;top:1px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:2px solid var(--rule)}
.stepper span.done{color:var(--ink2)}
.stepper span.done::before{background:var(--navy)}
.stepper span.done::after{background:var(--navy);border-color:var(--navy)}
.stepper span.cur{color:var(--ink);font-weight:700}
.stepper span.cur::before{background:linear-gradient(90deg,var(--navy) 50%,var(--rule) 50%)}
.stepper span.cur::after{border-color:var(--signal);background:var(--signal);box-shadow:0 0 0 4px var(--signal-soft)}
.actas{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy-soft);border-radius:5px;padding:10px 12px;margin-top:14px;font-size:13.5px}
.actas .seg{margin-left:auto}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.parties div{border:1px solid var(--rule2);border-radius:5px;padding:10px 12px;font-size:13.5px}
.parties div span{display:block;color:var(--muted);font-size:12px}
.code{font:600 32px var(--fig);letter-spacing:.18em;color:var(--navy);border:1px solid var(--rule);border-radius:6px;padding:8px 16px;display:inline-block;background:#fbfcfe;margin:6px 0 10px}
.filing{border-left:3px solid var(--rule);padding:6px 0 6px 14px;margin:8px 0 12px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;color:var(--ink2)}
.filing-h{font-weight:700;font-size:14px;margin-top:10px}
.award{background:#fff;border:1px solid var(--rule);border-top:6px solid var(--navy);border-radius:4px;padding:30px clamp(18px,5vw,48px) 34px;margin-bottom:16px;font-family:var(--doc);color:#1b2240;max-width:820px}
.award .court{text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted);letter-spacing:.02em}
.award h2{font-family:var(--doc);text-align:center;font-size:25px;font-weight:600;margin:8px 0 2px}
.award .vs{text-align:center;font-style:italic;color:var(--muted);font-size:15px}
.award .amount{text-align:center;margin:22px 0 18px;padding:16px 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2)}
.award .amount .fig{font-size:44px;color:var(--ink);display:block;line-height:1.05}
.award .amount div{font-family:var(--ui);font-size:14px;color:var(--ink2)}

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v ?? '').replace(/[$,\s]/g,'')); return isFinite(n) ? n : 0; };
const money = n => { n = Number(n); return isFinite(n) ? n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}) : '—'; };
const pct = n => (Math.round(Number(n)||0)) + '%';
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const nowStr = t => new Date(t||Date.now()).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
function deepMerge(t,p){ for(const k in p){ const v=p[k]; if(v && typeof v==='object' && !Array.isArray(v) && t[k] && typeof t[k]==='object' && !Array.isArray(t[k])) deepMerge(t[k],v); else t[k]=clone(v);} return t; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
const OTHER = r => r==='claimant' ? 'respondent' : 'claimant';
const CAP = r => r ? r[0].toUpperCase()+r.slice(1) : '';
function code(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

/* ============ state ============ */
const S = {
  view: 'home', advTab:'intake', db:null, user:null, sample:null, uid:null, booted:false,
  adv: { research:true, rs:null, progress:'', mode:'pro', f:{ side:'defense', posture:'discovery', punitive:'unknown' }, s:{ role:'plaintiff' }, files:[], result:null, busy:false, err:null, what:null, savedId:null },
  saved: [], disputes: [], dLoaded:false, dSlow:false, dErr:null,
  currentId:null, actingAs:{}, newD:{ category:'Contract / unpaid money' }, demoPick:{ id:'remodel', rt:'binding' }, join:{}, draft:{}, busy:{}, err:{}, copyText:null
};

/* ============ API + store (shared via /api/disputes, else this tab only) ============ */
async function api(path, payload){
  const r=await fetch(path, payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+').'));
  return j;
}
const mem = { docs:{}, subs:[] };
const memNotify = () => { const l = Object.entries(mem.docs).map(([id,d])=>({id,...clone(d)})); mem.subs.forEach(f=>f(l)); };
const chains = {};
function queued(id, fn){ const p=(chains[id]||Promise.resolve()).catch(()=>{}).then(fn); chains[id]=p; return p; }
let pollNow=()=>{};
const Store = {
  subscribe(cb){
    if(S.remote){
      let last='';
      const poll=async()=>{ try{ const j=await api('/api/disputes?uid='+encodeURIComponent(S.uid)); const k=JSON.stringify(j.disputes); if(k!==last){ last=k; cb(j.disputes,false); } else if(!S.dLoaded){ cb(j.disputes,false); } S.dErr=null; }catch(e){ S.dErr='Could not reach saved disputes. '+e.message; S.dLoaded=true; render(); } };
      pollNow=poll; poll(); setInterval(()=>{ if(!document.hidden) poll(); },4000);
      return ()=>{};
    }
    mem.subs.push(l=>cb(l,false)); memNotify(); return ()=>{};
  },
  async create(data){
    if(S.remote){ const j=await api('/api/disputes',{action:'create',uid:S.uid,data}); await pollNow(); return j.id; }
    const id='d'+Date.now(); mem.docs[id]=clone(data); memNotify(); return id;
  },
  update(id, patch){
    return queued(id, async ()=>{
      if(S.remote){ await api('/api/disputes',{action:'update',uid:S.uid,id,patch}); await pollNow(); }
      else { deepMerge(mem.docs[id], patch); advance(mem.docs[id]); memNotify(); }
    });
  },
  async findByCode(c){
    if(S.remote){ const j=await api('/api/disputes?code='+encodeURIComponent(c)); return j.dispute; }
    const e=Object.entries(mem.docs).find(([,d])=>d.inviteCode===c); return e?{id:e[0],...clone(e[1])}:null;
  }
};

// Status transitions computed from the merged dispute, so two people acting at once can't leave it stuck.
function advance(d){
  const c=d.consents||{}, f=d.filings||{}, q=d.questions||{}, r=d.responses||{};
  if(d.status==='consent' && c.claimant && c.respondent && c.claimant.ruleType===c.respondent.ruleType){
    d.status='pleadings';
    const bind=c.claimant.ruleType==='binding';
    d.agreed={ruleType:c.claimant.ruleType,cap:bind?Math.min(Number(c.claimant.cap)||0,Number(c.respondent.cap)||0):null};
  }
  if(d.status==='pleadings' && f.claimant?.submittedAt && f.respondent?.submittedAt) d.status='rebuttal';
  if(d.status==='rebuttal' && f.claimant?.rebuttalDone && f.respondent?.rebuttalDone) d.status='review';
  if(d.status==='questions' && q.claimantDone && q.respondentDone) d.status='deliberation';
  if(d.status==='ruled' && d.agreed?.ruleType!=='binding'){
    if(r.claimant==='reject'||r.respondent==='reject') d.status='rejected';
    else if(r.claimant==='accept'&&r.respondent==='accept') d.status='settled';
  }
  return d;
}

function slimDispute(d){ const x=clone(d); delete x.log; return x; }

/* ============ file reading ============ */
async function readFile(f){
  const name=f.name, lower=name.toLowerCase(), MAX=40000;
  try{
    if(/\.(txt|md|csv|json|eml|log|rtf|html?)$/.test(lower) || (f.type||'').startsWith('text/')){
      return {name, text:(await f.text()).slice(0,MAX)};
    }
    if(lower.endsWith('.pdf') && window.pdfjsLib){
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let out='';
      for(let i=1;i<=pdf.numPages && out.length<MAX;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); out+=`\n[p.${i}] `+c.items.map(x=>x.str).join(' '); }
      return {name, text: out.trim() ? out.slice(0,MAX) : '[PDF has no extractable text — scanned image]'};
    }
    if(lower.endsWith('.docx') && window.mammoth){
      const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); return {name, text:r.value.slice(0,MAX)};
    }
  }catch(e){ return {name, text:'[Could not read file: '+e.message+']'}; }
  return {name, text:'[File type not readable in prototype — name only]'};
}

/* ============ binding ============ */
function setPath(path, val){ const ks=path.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }
function getPath(path){ return path.split('.').reduce((o,k)=>o==null?undefined:o[k], S); }
document.addEventListener('input', e=>{
  const el=e.target, b=el.dataset.bind; if(!b) return;
  setPath(b, el.type==='checkbox' ? el.checked : el.value);
  if(el.dataset.rerender || b==='adv.f.practice') render();
  if(el.dataset.what) updateWhatIf();
});
document.addEventListener('change', async e=>{
  const el=e.target;
  if(el.dataset.demo){ if(el.dataset.demo==='go'){ if(!el.value) return; S.view='advisor'; } loadDemo(el.value); return; }
  if(!el.dataset.files) return;
  const target=el.dataset.files; const files=[...el.files]; if(!files.length) return;
  toast('Reading '+files.length+' file(s)…');
  const read=await Promise.all(files.map(readFile));
  const cur=getPath(target)||[]; setPath(target, cur.concat(read)); el.value=''; render();
});

function initWhat(r){
  const ds=r.damages_scenarios||[]; const exp=ds.reduce((s,d)=>s+num(d.amount)*num(d.probability)/100,0);
  return { dispo:num(r.dispositive?.defense_win_pct), liab:num(r.liability_at_trial_pct), dmult:100, exp, fee:num(r.fee_shift_if_plaintiff_wins), dcost:num(r.costs?.defense_to_verdict), pcost:num(r.costs?.plaintiff_to_verdict) };
}
function calc(w){
  const pWin=(1-w.dispo/100)*(w.liab/100); const dmg=w.exp*w.dmult/100;
  return { pWin, dmg, defExposure: pWin*(dmg+w.fee)+w.dcost, defJudgment: pWin*(dmg+w.fee), plNet: pWin*dmg - w.pcost };
}
function reportText(){
  const r=S.adv.result, c=calc(S.adv.what), st=r.settlement||{};
  return `CASEPULSE CASE ASSESSMENT — ${new Date().toLocaleDateString()}
${r.headline}

${r.summary}

OUTCOME PATH
- ${r.dispositive?.label}: defense wins ${pct(S.adv.what.dispo)}
- Liability at trial (plaintiff): ${pct(S.adv.what.liab)}
- Overall plaintiff win: ${pct(c.pWin*100)}
- Damages scenarios: ${(r.damages_scenarios||[]).map(d=>`${d.label} ${money(d.amount)} (${d.probability}%)`).join('; ')}
- Fee shifting if plaintiff wins: ${money(r.fee_shift_if_plaintiff_wins)}
- Expected judgment: ${money(c.defJudgment)} | Defense all-in: ${money(c.defExposure)} | Plaintiff net EV: ${money(c.plNet)}

SETTLEMENT
- Open: ${money(st.opening)} | Target: ${money(st.target_low)}–${money(st.target_high)} | Walkaway: ${money(st.walkaway)}
- Timing: ${st.timing}
- ${st.rationale}

RISK DRIVERS
${(r.risk_drivers||[]).map(d=>`- [${d.direction==='up'?'+':'-'}${d.weight}] ${d.factor}`).join('\n')}

STRATEGY
${(r.strategy||[]).map(x=>'- '+x).join('\n')}

EVIDENCE GAPS
${(r.evidence_gaps||[]).map(x=>'- '+x).join('\n')}

MISSING INFO
${(r.missing_info||[]).map(x=>'- '+x).join('\n')}

Confidence: ${r.confidence} — ${r.confidence_reason}
Nuclear verdict risk: ${(r.nuclear_risk&&r.nuclear_risk.level)||'n/a'} — ${(r.nuclear_risk&&r.nuclear_risk.reasoning)||''}
${S.adv.rs&&S.adv.rs.data?`
COMPARABLE OUTCOMES
${S.adv.rs.data.comparables.map(c=>`- ${c.title} (${[c.court,c.date].filter(Boolean).join(', ')}): ${c.amount?money(c.amount)+' — ':''}${c.outcome} ${c.url}`).join('\n')||'- none found'}
NEWS
${S.adv.rs.data.news.map(n=>`- ${n.title} — ${n.outlet||''} ${n.date||''}: ${n.takeaway} ${n.url}`).join('\n')||'- none found'}`:''}`;
}

const STATUS={invited:'Awaiting respondent',consent:'Consent',pleadings:'Filing',rebuttal:'Rebuttals',review:'Ready for judge',reviewing:'Judge reviewing',questions:"Judge's questions",deliberation:'Ready for ruling',deliberating:'Deliberating',ruled:'Ruling issued',settled:'Settled',rejected:'Rejected → court',paid:'Paid',closed:'Closed'};
const STEPS=[['invited','Join'],['consent','Consent'],['pleadings','File'],['rebuttal','Rebut'],['questions','Q&A'],['ruled','Ruling'],['paid','Done']];
function stepIdx(s){ const m={invited:0,consent:1,pleadings:2,rebuttal:3,review:4,reviewing:4,questions:4,deliberation:4,deliberating:4,ruled:5,settled:5,rejected:6,paid:6,closed:6}; return m[s]??0; }

/* ============ ADR case ============ */
function cur(){ return S.disputes.find(d=>d.id===S.currentId); }
function rolesOf(d){ return ['claimant','respondent'].filter(r=>d.parties?.[r]?.uid && d.parties[r].uid===S.uid); }
function roleOf(d){ const rs=rolesOf(d); if(rs.length===2) return S.actingAs[d.id]||'claimant'; return rs[0]||null; }
function dk(d,role){ return d.id+'_'+role; }
function adrDemo(d){ return d && d.demoId ? (window.ADR_DEMOS||[]).find(x=>x.id===d.demoId) : null; }
function seed(d, role){
  const dm=adrDemo(d); if(!dm||!role) return; const k=dk(d,role);
  if(S.draft[k]&&S.draft[k].seeded) return; const p=dm[role];

}

function gaugeSVG(p){
  const ang=-90+180*Math.max(0,Math.min(1,p));
  const arc=(a0,a1,col)=>{ const r=118, cx=150, cy=150; const pt=a=>[cx+r*Math.cos(Math.PI*(1+a)), cy+r*Math.sin(Math.PI*(1+a))]; const [x0,y0]=pt(a0),[x1,y1]=pt(a1); return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="18" fill="none"/>`; };
  const ticks=[0,.25,.5,.75,1].map(t=>{ const a=Math.PI*(1+t); const x0=150+96*Math.cos(a),y0=150+96*Math.sin(a),x1=150+104*Math.cos(a),y1=150+104*Math.sin(a); return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="#7f89b3" stroke-width="2"/>`; }).join('');
  return `<svg class="gauge" viewBox="0 0 300 172" role="img" aria-label="Chance the plaintiff wins: ${Math.round(p*100)} percent">
    ${arc(0,.333,'#3d8f6c')}${arc(.338,.662,'#c98a2b')}${arc(.667,1,'#c4473b')}${ticks}
    <text x="32" y="168" fill="#8f99c2" font-size="12" font-family="Public Sans">0%</text><text x="250" y="168" fill="#8f99c2" font-size="12" font-family="Public Sans">100%</text>
    <g class="needle" id="needle" data-angle="${ang.toFixed(1)}" style="transform:rotate(-90deg)"><line x1="150" y1="150" x2="150" y2="44" stroke="#f79420" stroke-width="4" stroke-linecap="round"/></g>
    <circle cx="150" cy="150" r="9" fill="#f79420"/><circle cx="150" cy="150" r="3.5" fill="#17204b"/>
  </svg>`;
}
function swingNeedle(){ const n=document.getElementById('needle'); if(n) n.style.transform=`rotate(${n.dataset.angle}deg)`; }
function settlementStrip(st){
  const f=S.adv.f||{}, pts={open:num(st.opening),lo:num(st.target_low),hi:num(st.target_high),walk:num(st.walkaway),dem:num(f.demand),off:num(f.offer)};
  const max=Math.max(pts.open,pts.hi,pts.walk,pts.dem,pts.off,1)*1.08;
  const x=v=>Math.max(0,Math.min(100,v/max*100)).toFixed(2)+'%';
  const mark=(v,label,cls)=>v?`<div class="mark ${cls||''}" style="left:${x(v)}">${label}<i></i></div>`:'';
  return `<div class="strip" aria-hidden="true"><div class="track"></div>
    ${pts.hi?`<div class="band" style="left:${x(pts.lo)};width:calc(${x(pts.hi)} - ${x(pts.lo)})"></div>`:''}
    ${mark(pts.open,'Open','open')}${mark(pts.walk,'Walk away','walk')}
    ${pts.off?`<div class="mark low" style="left:${x(pts.off)}">Offer ${money(pts.off)}</div>`:''}
    ${pts.dem?`<div class="mark low" style="left:${x(pts.dem)}">Demand ${money(pts.dem)}</div>`:''}

}

function researchCard(){
  const rs=S.adv.rs; if(!rs) return '';
  const st=rs.sources||{}, d=rs.data;
  const chip=(name,label)=>{ const v=st[name]; const cls=v==='ok'?'low':v==='not_configured'?'navy':v?'high':'navy'; const txt=v==='ok'?'searched':v==='not_configured'?'not set up':v?'unavailable':'not used'; return `<span class="tag ${cls}">${label} ${txt}</span>`; };
  let h=`<section class="sheet"><div class="sheet-h"><h3>Comparable verdicts and news</h3></div><div class="src">${chip(SRC.cl,'CourtListener')}${st[SRC.tr]&&st[SRC.tr]!=='not_configured'?chip(SRC.tr,'Trellis'):''}${chip(SRC.web,'Web news')}</div>`;
  if(rs.err) return h+`<div class="note">${esc(rs.err)}</div></section>`;
  if(!d) return h+'</section>';
  if(d.summary) h+=`<p class="small">${esc(d.summary)}</p>`;
  if(!d.comparables.length && !d.news.length) h+=`<p class="small mut">Nothing close enough to count as a comparable came back.</p>`;
  h+=d.comparables.map(c=>`<div class="comp"><div class="t"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.amount!=null&&num(c.amount)?`<span class="amt">${money(c.amount)}</span>`:''}</div>
    <div class="meta">${esc(c.source)}${c.court?', '+esc(c.court):''}${c.date?', '+esc(c.date):''}</div>
    <div class="small">${esc(c.outcome)}</div><div class="tiny mut">${esc(c.why_relevant)}</div></div>`).join('');
  if(d.news.length) h+=`<h4 style="margin-top:14px">In the news</h4>`+d.news.map(n=>`<div class="comp"><div class="t"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div><div class="meta">${esc(n.outlet||'')}${n.date?', '+esc(n.date):''}</div><div class="small">${esc(n.takeaway)}</div></div>`).join('');
  const hints=[];
  if(st[SRC.cl]==='error') hints.push('CourtListener did not answer this time. Run the valuation again to retry.');
  if(st[SRC.web]==='error') hints.push('News search did not answer this time. Run the valuation again to retry.');
  h+=`<p class="tiny mut" style="margin-top:10px">Every link comes from a source's own search results${d.dropped?`; ${d.dropped} item(s) without a verifiable link were removed`:''}. Amounts appear only where the source states them. ${esc(d.gaps)}</p>${hints.length?`<div class="note">${hints.map(esc).join('<br>')}</div>`:''}</section>`;
  return h;
}

  async createD(){
    const n=S.newD; S.err.create=null;
    if(!n.name||!n.title||!num(n.amount)){ S.err.create='Name, title and amount are required.'; return render(); }
    S.busy.create=true; render();
    try{
      const id=await Store.create({title:n.title,category:n.category,state:n.state||'',amountClaimed:num(n.amount),summary:n.summary||'',createdAt:Date.now(),status:'invited',inviteCode:code(),memberIds:[S.uid],parties:{claimant:{uid:S.uid,name:n.name},respondent:null},consents:{},filings:{},questions:null,ruling:null,responses:{},payment:null,counterclaim:0,log:[{t:Date.now(),m:`${n.name} opened the dispute`}]});
      S.newD={category:'Contract / unpaid money'}; S.currentId=id; S.view='case';
    }catch(e){ S.err.create='Could not create: '+(e.code||e.message); }
    S.busy.create=false; render();
  },
  async joinD(){
    const j=S.join; S.err.join=null; const c=String(j.code||'').trim().toUpperCase();
    if(!c||!j.name){ S.err.join='Code and name are required.'; return render(); }
    S.busy.join=true; render();
    try{
      const d=await Store.findByCode(c);
      if(!d) throw new Error('No dispute found with that code.');
      if(d.parties?.respondent?.uid && d.parties.respondent.uid!==S.uid) throw new Error('Someone has already joined this dispute as respondent.');
      await Store.update(d.id,{parties:{respondent:{uid:S.uid,name:j.name}},memberIds:[...new Set([...(d.memberIds||[]),S.uid])],counterclaim:num(j.counter),status:'consent',log:logAdd(d,`${j.name} joined as respondent`)});
      S.join={}; S.currentId=d.id; S.view='case'; if(d.parties?.claimant?.uid===S.uid) S.actingAs[d.id]='respondent';
    }catch(e){ S.err.join=e.message||String(e.code); }
    S.busy.join=false; render();
  },
  open(ds){ S.currentId=ds.id; S.view='case'; S.copyText=null; window.scrollTo(0,0); render(); },
  actas(ds){ S.actingAs[S.currentId]=ds.v; render(); },
  copycode(ds){ doCopy(ds.c); },
  rt(ds){ const d=cur(); S.draft[dk(d,roleOf(d))].ruleType=ds.v; render(); },
  addcard(){ const d=cur(); S.draft[dk(d,roleOf(d))].card=true; render(); },
  rmcard(){ const d=cur(); S.draft[dk(d,roleOf(d))].card=false; render(); },
  signConsent(){
    const d=cur(), role=roleOf(d), dr=S.draft[dk(d,role)], bind=dr.ruleType==='binding';
    if(!dr.c1||!dr.c2||(bind&&!dr.c3)){ S.err[d.id]='Check every box to consent.'; return render(); }
    if(!String(dr.sig||'').trim()){ S.err[d.id]='Type your full name to sign.'; return render(); }
    const capv=num(dr.cap||Math.max(num(d.amountClaimed),num(d.counterclaim)));
    if(bind&&!dr.card){ S.err[d.id]='Binding mode requires a card on file.'; return render(); }
    if(bind&&capv<=0){ S.err[d.id]='Set a cap greater than $0.'; return render(); }
    const consent={ruleType:dr.ruleType,cap:bind?capv:null,card:bind?{brand:'Visa',last4:'4242',test:true}:null,signedName:dr.sig.trim(),signedAt:Date.now()};
    act(d, async()=>{
      const other=d.consents?.[OTHER(role)]; const patch={consents:{[role]:consent},log:logAdd(d,`${CAP(role)} signed ${consent.ruleType} consent`)};
      if(other && other.ruleType===consent.ruleType){ patch.status='pleadings'; patch.agreed={ruleType:consent.ruleType,cap:bind?Math.min(capv,num(other.cap)):null}; }
      await Store.update(d.id,patch);
    });
  },
  revokeConsent(){ const d=cur(), role=roleOf(d); act(d,()=>Store.update(d.id,{consents:{[role]:null},log:logAdd(d,`${CAP(role)} revised consent`)})); },
  file(){
    const d=cur(), role=roleOf(d), dr=S.draft[dk(d,role)]||{};
    if(!String(dr.statement||'').trim()){ S.err[d.id]='Write your statement before filing.'; return render(); }
    act(d, async()=>{
      const patch={filings:{[role]:{statement:dr.statement.trim(),evidence:(dr.evidence||[]).map(f=>({name:f.name,text:String(f.text).slice(0,20000)})),submittedAt:Date.now()}},log:logAdd(d,`${CAP(role)} filed`)};
      if(d.filings?.[OTHER(role)]) patch.status='rebuttal';
      await Store.update(d.id,patch);
    });
  },
  rebut(ds){
    const d=cur(), role=roleOf(d), dr=S.draft[dk(d,role)]||{}, waive=!!ds.waive;
    if(!waive && !String(dr.rebuttal||'').trim()){ S.err[d.id]='Write a rebuttal or tap Waive.'; return render(); }
    act(d, async()=>{
      const patch={filings:{[role]:{rebuttal:waive?'':dr.rebuttal.trim(),rebuttalDone:true}},log:logAdd(d,`${CAP(role)} ${waive?'waived':'filed'} rebuttal`)};
      if(d.filings?.[OTHER(role)]?.rebuttalDone) patch.status='review';
      await Store.update(d.id,patch);
    });
  },
  judgeReview(){
    const d=cur();
    act(d, async()=>{
      await Store.update(d.id,{status:'reviewing'});
      try{
        const q=(await api('/api/ai',{task:'questions',dispute:slimDispute(d)})).result||{};
        const norm=a=>(Array.isArray(a)?a:[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,3).map(x=>({q:x.trim(),a:''}));
        const qc=norm(q.claimant), qr=norm(q.respondent);
        const questions={claimant:qc,respondent:qr,note:String(q.note||''),claimantDone:!qc.length,respondentDone:!qr.length};
        await Store.update(d.id,{questions,status:(qc.length||qr.length)?'questions':'deliberation',log:logAdd(d,`Judge reviewed the record and asked ${qc.length+qr.length} question(s)`)});
      }catch(e){ await Store.update(d.id,{status:'review'}); throw e; }
    });
  },
  answer(){
    const d=cur(), role=roleOf(d), dr=S.draft[dk(d,role)]||{}, qs=d.questions[role]||[];
    const ans=qs.map((x,i)=>({q:x.q,a:String(dr.ans?.[i]||'').trim()}));
    if(ans.some(x=>!x.a)){ S.err[d.id]='Answer every question (write "I don\'t know" if needed).'; return render(); }
    act(d, async()=>{
      const patch={questions:{[role]:ans,[role+'Done']:true},log:logAdd(d,`${CAP(role)} answered the judge`)};
      if(d.questions[OTHER(role)+'Done']) patch.status='deliberation';
      await Store.update(d.id,patch);
    });
  },
  rule(){
    const d=cur();
    act(d, async()=>{
      await Store.update(d.id,{status:'deliberating'});
      try{
        const r=(await api('/api/ai',{task:'ruling',dispute:slimDispute(d)})).result||{}; const dec=r.decision||(r.decision={});
        let amt=Math.max(0,num(dec.award_amount));
        if(!['claimant','respondent','none'].includes(dec.payer)) dec.payer=amt?'respondent':'none';
        const limit=dec.payer==='respondent'?num(d.amountClaimed):num(d.counterclaim);
        if(amt>limit){ amt=limit; }
        if(d.agreed?.ruleType==='binding' && amt>num(d.agreed.cap)){ amt=num(d.agreed.cap); dec.capped=true; }
        dec.award_amount=amt; if(!amt) dec.payer='none';
        r.issuedAt=Date.now();
        await Store.update(d.id,{ruling:r,status:'ruled',log:logAdd(d,`Ruling issued: ${amt?money(amt)+' payable by '+dec.payer:'no award'}`)});
      }catch(e){ await Store.update(d.id,{status:'deliberation'}); throw e; }
    });
  },
  respond(ds){
    const d=cur(), role=roleOf(d);
    act(d, async()=>{
      const resp={...(d.responses||{}),[role]:ds.v};
      const patch={responses:{[role]:ds.v},log:logAdd(d,`${CAP(role)} ${ds.v==='accept'?'accepted':'rejected'} the ruling`)};
      if(ds.v==='reject') patch.status='rejected'; else if(resp[OTHER(role)]==='accept') patch.status='settled';
      await Store.update(d.id,patch);
    });
  },
  execute(){
    const d=cur(), dec=d.ruling.decision, amt=num(dec.award_amount);
    act(d, async()=>{
      if(!amt||dec.payer==='none'){ await Store.update(d.id,{status:'closed',log:logAdd(d,'Closed — no payment due')}); return; }
      const from=dec.payer, to=OTHER(from), last4=d.consents?.[from]?.card?.last4||'4242';
      await new Promise(r=>setTimeout(r,900));
      await Store.update(d.id,{status:'paid',payment:{amount:amt,from,to,last4,ref:'pi_test_'+Math.random().toString(36).slice(2,12),at:Date.now(),method:'Stripe off-session charge → Connect transfer (simulated)'},log:logAdd(d,`${money(amt)} charged to ${from} and paid to ${to} (simulated)`)});
    });
  },
  copyaward(){ doCopy(awardText(cur())); },
  demoRt(ds){ S.demoPick.rt=ds.v; render(); },
  async startDemo(){
    const dm=(window.ADR_DEMOS||[]).find(x=>x.id===S.demoPick.id); if(!dm) return;
    S.err.demo=null; S.busy.demo=true; render();
    try{
      const id=await Store.create({title:dm.title+' (demo)',category:dm.category,state:dm.state,amountClaimed:dm.amount,summary:dm.summary,createdAt:Date.now(),status:'consent',inviteCode:code(),memberIds:[S.uid],
        parties:{claimant:{uid:S.uid,name:dm.claimant.name},respondent:{uid:S.uid,name:dm.respondent.name}},consents:{},filings:{},questions:null,ruling:null,responses:{},payment:null,counterclaim:dm.counter||0,
        demoId:dm.id,demoRule:S.demoPick.rt||'binding',log:[{t:Date.now(),m:'Demo dispute created (both parties joined)'}]});
      S.currentId=id; S.actingAs[id]='claimant'; S.view='case'; window.scrollTo(0,0);
    }catch(e){ S.err.demo='Could not start demo: '+(e.code||e.message); }
    S.busy.demo=false; render();
  },
  ffwd(){
    const d=cur(), dm=adrDemo(d); if(!dm) return;
    const rt=d.demoRule||'binding', bind=rt==='binding', now=Date.now();
    const consent=r=>({ruleType:rt,cap:bind?dm.cap:null,card:bind?{brand:'Visa',last4:r==='claimant'?'4242':'1881',test:true}:null,signedName:dm[r].name,signedAt:now});
    const filing=r=>({statement:dm[r].statement,evidence:clone(dm[r].evidence),submittedAt:now,rebuttal:dm[r].rebuttal,rebuttalDone:true});
    act(d,()=>Store.update(d.id,{consents:{claimant:consent('claimant'),respondent:consent('respondent')},agreed:{ruleType:rt,cap:bind?dm.cap:null},
      filings:{claimant:filing('claimant'),respondent:filing('respondent')},status:'review',log:logAdd(d,'Demo fast-forward: both sides consented, filed and rebutted')}));
  },
  async demoAnswers(){
    const d=cur(), role=roleOf(d), dm=adrDemo(d), k=dk(d,role), qs=(d.questions&&d.questions[role])||[];
    if(!dm||!qs.length) return; S.busy['ans'+k]=true; render();
    if(!S.draft[k]) S.draft[k]={}; if(!S.draft[k].ans) S.draft[k].ans={};
    try{
      const r=(await api('/api/ai',{task:'answers',role,name:dm[role].name,facts:dm[role].facts,statement:dm[role].statement,questions:qs.map(x=>x.q)})).result||{};
      (r.answers||[]).forEach((a,i)=>{ if(i<qs.length) S.draft[k].ans[i]=String(a); });
    }catch(e){ qs.forEach((x,i)=>{ if(!S.draft[k].ans[i]) S.draft[k].ans[i]='(Demo) '+dm[role].facts.split('. ')[i%3]+'.'; }); toast('The AI is unavailable, so answers were filled from the case facts.'); }
    S.busy['ans'+k]=false; render();
  },
  packet(){ doCopy(packetText(cur())); },
};
document.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const el=e.target.closest('tr[data-act]'); if(el) el.click(); } });
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A'||el.classList.contains('radio')) e.preventDefault();
  const f=A[el.dataset.act]; if(f) f(el.dataset, el);
});

/* ============ saved evals (this browser) ============ */
function loadSaved(){ try{ S.saved=JSON.parse(localStorage.getItem('cp_saved')||'[]')||[]; }catch(e){ S.saved=[]; } }

/* ============ boot ============ */
function visitorId(){
  try{ let id=localStorage.getItem('cp_uid'); if(!id){ id='v'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('cp_uid',id); } return id; }
  catch(e){ return 'v'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
}
loadSaved();
render();
(async()=>{
  S.uid=visitorId();
  try{ const h=await api('/api/health'); S.health=h; S.remote=!!h.shared; }catch(e){ S.health=null; S.remote=false; }
  S.db=S.remote;
  const t=setTimeout(()=>{ if(!S.dLoaded){ S.dSlow=true; render(); } },10000);
  Store.subscribe((list,fromCache)=>{ S.disputes=list; S.dLoaded=true; clearTimeout(t); render(); });
  render();
})();
</script>
